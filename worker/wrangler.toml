name = "garden-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
GITHUB_REPO = "jeswingit/garden"
GITHUB_BRANCH = "main"
# Origins allowed to call the API (comma separated). Add http://localhost:4321 to test locally.
ALLOWED_ORIGINS = "https://garden.jeswin.co"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   GITHUB_TOKEN     fine-grained token, this repo only, Contents: Read and write
#   GOOGLE_CLIENT_ID OAuth client ID from Google Cloud Console
#   ALLOWED_EMAILS   comma-separated Google accounts allowed to edit
